# Netlify deploys the Vite app in app/ and serves the SPA fallback.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in
# Site configuration -> Environment variables before the first deploy.

[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
